<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="_fragments/layout :: layout(~{::section}, '주문 상세')">
<section th:fragment="content" th:object="${order}" class="admin-page">
  <style>
    :root { --primary:#0046ff; --text:#1f2d3d; --muted:#64748b; --bg:#f6f8fb; --card:#fff; --border:#e5e8eb; }
    .admin-page { background: var(--bg); min-height:100vh; padding: 24px 0 40px; }
    .admin-container { max-width: 1100px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:16px; }
    h1 { margin:0 0 6px; font-size:26px; font-weight:800; color:var(--text); }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
    .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    dl { display:grid; grid-template-columns: 120px 1fr; row-gap:8px; column-gap:12px; margin:0; }
    dt { color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px 14px; border-bottom:1px solid rgba(229,232,235,.7); text-align:left; }
    thead th { background:rgba(243,244,246,.66); font-weight:700; color:#374151; }
    .actions { display:flex; gap:8px; }
    .btn { height:36px; padding:0 14px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  </style>
  <div class="admin-container">
    <h1>주문 상세 <small th:text="*{id}"></small></h1>

    <div class="grid-2">
      <article class="panel">
        <h3 style="margin:0 0 10px;">주문자 정보</h3>
        <dl>
          <dt>회원</dt><dd th:text="*{memberId}">-</dd>
          <dt>주문일</dt><dd th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}">-</dd>
          <dt>상태</dt><dd th:text="*{status}">PENDING</dd>
        </dl>
      </article>

      <article class="panel">
        <h3 style="margin:0 0 10px;">결제/배송</h3>
        <dl>
          <dt>수단</dt><dd th:text="${payment?.method}">-</dd>
          <dt>상태</dt><dd th:text="${payment?.status}">-</dd>
          <dt>금액</dt><dd th:text="${#numbers.formatInteger(payment?.amount, 3, 'COMMA')}">0</dd>
          <dt>배송지</dt><dd th:text="${shipment?.address}">-</dd>
        </dl>
      </article>
    </div>

    <article class="panel">
      <h3 style="margin:0 0 10px;">주문상품</h3>
      <table>
        <thead>
        <tr>
          <th>상품</th>
          <th>수량</th>
          <th>단가</th>
          <th>소계</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${orderItems}">
          <td th:text="${i.productName}">-</td>
          <td th:text="${i.quantity}">1</td>
          <td th:text="${#numbers.formatInteger(i.unitPrice, 3, 'COMMA')}">0</td>
          <td th:text="${#numbers.formatInteger(i.subtotal, 3, 'COMMA')}">0</td>
        </tr>
        </tbody>
      </table>
    </article>

    <article class="panel actions">
      <form th:action="@{|/admin/orders/${order.id}/status|}" method="post">
        <select name="status">
          <option>PENDING</option>
          <option>PAID</option>
          <option>SHIPPED</option>
          <option>CANCELLED</option>
          <option>REFUNDED</option>
        </select>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button class="btn btn-primary" type="submit">상태 저장</button>
      </form>
      <a class="btn" th:href="@{/admin/orders}">목록</a>
    </article>
  </div>
</section>
</html>
